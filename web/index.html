<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f3f5f9" />
    <title>Assistant</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f766e'/%3E%3Ccircle cx='16' cy='16' r='8.6' fill='none' stroke='%23fff' stroke-width='2.2' opacity='.9'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23fff'/%3E%3Ccircle cx='23.2' cy='9.6' r='2' fill='%23fff' opacity='.9'/%3E%3C/svg%3E" />
    <script>
      // Set the theme before the first paint, so a dark page never flashes white. The choice is
      // kept in this browser only; where storage is blocked, the system setting simply applies.
      try {
        var t = localStorage.getItem('assistant-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0f15' : '#f3f5f9')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
