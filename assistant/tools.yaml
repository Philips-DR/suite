# The only file in the system that knows every tool exists.
#
# Each entry is a child process the assistant launches and speaks MCP to over stdio.
# Nothing here has to be running beforehand, and every one of these is equally usable
# from its own terminal with the assistant absent.
#
# Paths may use ~ and $VAR, and a relative path is resolved against THIS FILE's directory
# rather than the working directory — so the defaults below assume the tools are siblings
# of this repository. Point them anywhere by editing these, or by setting the variables.
#
# `env` is where a tool's paths and credentials are injected. A tool never discovers
# either for itself.

servers:
  - name: meet-ai
    command: ${MEET_AI_HOME:-../meet-ai}/mcp
    cwd: ${MEET_AI_HOME:-../meet-ai}

  - name: docu-ai
    command: npm
    args: ["run", "--silent", "mcp"]
    cwd: ${DOCU_AI_HOME:-../docu-ai}
    env:
      # Where save_export writes a Word or PDF file for mail-ai to attach. A file cannot travel through the model
      # (a Word CV is ~650 KB), so it travels by path; mail-ai is given the same folder and attaches from it only.
      DOCU_AI_EXPORTS: ${ASSISTANT_UPLOADS:-../assistant/uploads}/exports

  # Checks between a job posting, the user's own material and a draft: every requirement set against what
  # the material shows, and every figure and overstating word in a draft traced to a line. Reads only. The
  # uploads folder is the one place it may read from, injected here like every other path.
  - name: apply-ai
    command: ${APPLY_AI_HOME:-../apply-ai}/mcp
    cwd: ${APPLY_AI_HOME:-../apply-ai}
    env:
      APPLY_AI_ROOTS: ${ASSISTANT_UPLOADS:-../assistant/uploads}

  # Reads web pages, checks that a link answers, and asks GitHub what a stranger sees. Reads only, but it
  # reaches the internet, so it refuses every address that is not a public one: it cannot be pointed at this
  # machine's own network. It is given no credential and no path, and has no cookie, login or write.
  - name: web-ai
    command: ${WEB_AI_HOME:-../web-ai}/mcp
    cwd: ${WEB_AI_HOME:-../web-ai}

  - name: mail-ai
    command: ${MAIL_AI_HOME:-../mail-ai}/mcp
    cwd: ${MAIL_AI_HOME:-../mail-ai}
    env:
      # Drafting and sending, switched on deliberately (2026-09-26). Sending still needs
      # two presses in the app, or an approval in chat, over the rendered message.
      MAIL_AI_COMPOSE: "1"
      # The one folder a file may be attached from by path: where docu-ai's save_export writes.
      MAIL_AI_ATTACH_ROOT: ${ASSISTANT_UPLOADS:-../assistant/uploads}/exports
    # Run by the backend whether or not a page is open: the page's own timer left the mailbox five days stale.
    # It fetches new mail into the local store and changes nothing in Gmail. Audited when its outcome changes.
    schedule:
      - tool: sync
        every_minutes: 30

  # PDF to audiobook, in a cloned voice. Reading a book and rendering it are background jobs of
  # minutes to hours; job_status is how anyone watches them.
  - name: audiobook
    command: ${AUDIOBOOK_HOME:-../audiobook}/mcp
    cwd: ${AUDIOBOOK_HOME:-../audiobook}
    # The audio it makes, which the web app may play and download. Relative to its own folder;
    # nothing outside the folders named here is ever served.
    files: [output]
