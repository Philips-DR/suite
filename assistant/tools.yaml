# The only file in the system that knows every tool exists.
#
# Each entry is a child process the assistant launches and speaks MCP to over stdio.
# Nothing here has to be running beforehand, and every one of these is equally usable
# from its own terminal with the assistant absent.
#
# Paths may use ~ and $VAR, and a relative path is resolved against THIS FILE's directory
# rather than the working directory — so the defaults below assume the tools are siblings
# of this repository. Point them anywhere by editing these, or by setting the variables.
#
# `env` is where a tool's paths and credentials are injected. A tool never discovers
# either for itself.

servers:
  - name: meet-ai
    command: ${MEET_AI_HOME:-../meet-ai}/mcp
    cwd: ${MEET_AI_HOME:-../meet-ai}

  - name: docu-ai
    command: npm
    args: ["run", "--silent", "mcp"]
    cwd: ${DOCU_AI_HOME:-../docu-ai}

  - name: mail-ai
    command: ${MAIL_AI_HOME:-../mail-ai}/mcp
    cwd: ${MAIL_AI_HOME:-../mail-ai}
    env:
      # Drafting and sending, switched on deliberately (2026-09-26). Sending still needs
      # two presses in the app, or an approval in chat, over the rendered message.
      MAIL_AI_COMPOSE: "1"

  # PDF to audiobook, in a cloned voice. Reading a book and rendering it are background jobs of
  # minutes to hours; job_status is how anyone watches them.
  - name: audiobook
    command: ${AUDIOBOOK_HOME:-../audiobook}/mcp
    cwd: ${AUDIOBOOK_HOME:-../audiobook}
    # The audio it makes, which the web app may play and download. Relative to its own folder;
    # nothing outside the folders named here is ever served.
    files: [output]
